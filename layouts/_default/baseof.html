<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} | Tucson Resource Hub</title>
    <style>
        :root { --bg: #f4f4f9; --text: #1a1a1a; --primary: #0056b3; }
        body { font-family: Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; margin: 0; padding: 0; }
        main { max-width: 800px; margin: 40px auto; padding: 20px; }
        .skip-link { position: absolute; top: -40px; left: 0; background: #000; color: #fff; padding: 8px; z-index: 100; }
        .skip-link:focus { top: 0; }
        .cta-button { display: inline-block; background: var(--primary); color: white; padding: 12px 24px; text-decoration: none; border-radius: 5px; font-weight: bold; margin: 10px 0; }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <main id="main-content">
        {{ block "main" . }}{{ end }}
    </main>
</body>
</html>
