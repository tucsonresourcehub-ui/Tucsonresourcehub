<div class="lead-form-container" style="background: #f8fafc; border: 2px solid #2563eb; padding: 24px; border-radius: 8px; margin-top: 28px;">
  <h3 style="margin-top: 0; color: #1e3a8a;">Free Accident & Injury Case Review</h3>
  <p style="font-size: 0.95rem; color: #475569;">Were you involved in a crash in Pima County? Fill out this confidential form to request a free legal evaluation.</p>
  
  <form name="car-accident-intake" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/thank-you/" class="intake-form">
  <!-- Hidden field required for Netlify detection -->
  <input type="hidden" name="form-name" value="car-accident-intake" />
  
  <p style="display:none;">
    <label>Don’t fill this out if you’re human: <input name="bot-field" /></label>
  </p>

  <div style="margin-bottom: 15px;">
    <label for="name" style="display:block; font-weight:bold;">Full Name *</label>
    <input type="text" id="name" name="name" required placeholder="Jane Doe" style="width: 100%; padding: 8px;" />
  </div>

  <div style="margin-bottom: 15px;">
    <label for="phone" style="display:block; font-weight:bold;">Phone Number *</label>
    <input type="tel" id="phone" name="phone" required placeholder="(520) 000-0000" style="width: 100%; padding: 8px;" />
  </div>

  <div style="margin-bottom: 15px;">
    <label for="email" style="display:block; font-weight:bold;">Email Address</label>
    <input type="email" id="email" name="email" placeholder="jane@example.com" style="width: 100%; padding: 8px;" />
  </div>

  <div style="margin-bottom: 15px;">
    <label for="injured" style="display:block; font-weight:bold;">Were you or someone involved injured?</label>
    <select id="injured" name="injured" style="width: 100%; padding: 8px;">
      <option value="Yes">Yes</option>
      <option value="No">No</option>
    </select>
  </div>

  <div style="margin-bottom: 15px;">
    <label for="details" style="display:block; font-weight:bold;">Briefly describe what happened</label>
    <textarea id="details" name="details" rows="4" placeholder="Accident location, dates, or injuries..." style="width: 100%; padding: 8px;"></textarea>
  </div>

  <button type="submit" style="background-color: #0056b3; color: white; padding: 12px 20px; border: none; cursor: pointer; font-weight: bold;">
    Submit Confidential Request
  </button>
  </form>
