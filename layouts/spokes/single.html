{{ define "main" }}
<header>
    <a href="/">← Back to Tucson Resources</a>
</header>
<article>
    <h1>{{ .Title }}</h1>
    
    <div style="background: #e8f4f8; padding: 15px; margin-bottom: 20px; border-left: 5px solid var(--primary);">
        <strong>The Quick Answer:</strong> {{ .Params.short_answer }}
    </div>

    {{ .Content }}

    <!-- Automated JSON-LD FAQ Schema Generator -->
    {{ if .Params.faq }}
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {{ range $index, $qa := .Params.faq }}
        {{ if $index }},{{ end }}
        {
          "@type": "Question",
          "name": "{{ .question }}",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "{{ .answer }}"
          }
        }
        {{ end }}
      ]
    }
    </script>
    {{ end }}
</article>
{{ end }}
